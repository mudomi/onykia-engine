[package]
name = "export-fonts"
version = "0.1.0"
edition = "2021"
publish = false
description = "Writes typst's default font set plus a stub manifest for the onykia-engine npm package."

[dependencies]
typst-assets = { version = "0.15", features = ["fonts"] }
typst-library = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
