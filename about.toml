# cargo-about configuration for generating the Rust dependency
# attribution block in NOTICE.
#
# The list of `accepted` SPDX identifiers must stay aligned with the
# license texts reproduced in NOTICE (§A–§E). Any new license that
# appears in the dependency graph causes `cargo about generate` to
# fail, forcing a deliberate review before NOTICE can be regenerated.

accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "OFL-1.1",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

# We only ship a wasm32-unknown-unknown artifact, so restrict the
# graph walk to that target — keeps host-only crates (e.g. windows-*)
# out of the report.
targets = ["wasm32-unknown-unknown"]

