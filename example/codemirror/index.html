<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onykia x CodeMirror</title>
    <style>
      html, body, #app { margin: 0; height: 100%; }
      #app { display: grid; grid-template-columns: auto 1fr 1fr; grid-template-rows: auto 1fr; height: 100vh; }
      #toolbar { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; padding: 6px 12px; border-bottom: 1px solid #ddd; background: #f5f5f5; font: 14px system-ui, sans-serif; }
      #toolbar label { color: #555; }
      #toolbar .group { display: flex; gap: 6px; align-items: center; }
      #toolbar .spacer { flex: 1; }
      #toolbar [hidden] { display: none; }
      #export-standards { position: relative; }
      .standards-panel { position: absolute; z-index: 1; display: grid; padding: 6px 8px; background: #fff; border: 1px solid #ccc; }
      .standards-panel strong { margin-top: 6px; color: #888; }
      #editor, #preview, #outline { overflow: auto; }
      #editor, #outline { border-right: 1px solid #ddd; }
      #outline { width: 220px; padding: 8px; font: 13px system-ui, sans-serif; }
      #outline ul { list-style: none; margin: 0; padding-left: 14px; }
      #outline > ul { padding-left: 0; }
      #outline button { display: block; width: 100%; padding: 2px 4px; border: 0; border-radius: 4px; background: none; font: inherit; text-align: left; cursor: pointer; }
      #outline button:hover { background: #eee; }
      #outline .empty { margin: 4px; color: #888; }
      #preview { padding: 16px; background: #fafafa; }
      #preview svg, #preview canvas, #preview iframe { display: block; max-width: 100%; height: auto; box-shadow: 0 1px 4px rgba(0,0,0,.1); margin: 0 auto 12px; background: #fff; }
      #preview iframe { width: 100%; height: calc(100vh - 80px); border: 0; }
      .cm-editor { height: 100%; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <div class="group">
          <label for="preview-format">Preview:</label>
          <select id="preview-format">
            <option value="svg">SVG</option>
            <option value="canvas">Canvas (raster)</option>
            <option value="html">HTML</option>
          </select>
        </div>
        <div class="group">
          <label><input type="checkbox" id="follow-cursor" /> Follow cursor</label>
        </div>
        <div class="spacer"></div>
        <div class="group">
          <label for="export-format">Export:</label>
          <select id="export-format">
            <option value="pdf">PDF</option>
            <option value="svg">SVG</option>
            <option value="png">PNG</option>
          </select>
          <label id="export-page-label" for="export-page" hidden>Page:</label>
          <select id="export-page" hidden></select>
          <details id="export-standards" hidden>
            <summary>Standards</summary>
            <div class="standards-panel">
              <strong>Version</strong>
              <label><input type="checkbox" value="1.4" /> PDF 1.4</label>
              <label><input type="checkbox" value="1.5" /> PDF 1.5</label>
              <label><input type="checkbox" value="1.6" /> PDF 1.6</label>
              <label><input type="checkbox" value="1.7" /> PDF 1.7</label>
              <label><input type="checkbox" value="2.0" /> PDF 2.0</label>
              <strong>PDF/A</strong>
              <label><input type="checkbox" value="a-1b" /> PDF/A-1b</label>
              <label><input type="checkbox" value="a-1a" /> PDF/A-1a</label>
              <label><input type="checkbox" value="a-2b" /> PDF/A-2b</label>
              <label><input type="checkbox" value="a-2u" /> PDF/A-2u</label>
              <label><input type="checkbox" value="a-2a" /> PDF/A-2a</label>
              <label><input type="checkbox" value="a-3b" /> PDF/A-3b</label>
              <label><input type="checkbox" value="a-3u" /> PDF/A-3u</label>
              <label><input type="checkbox" value="a-3a" /> PDF/A-3a</label>
              <label><input type="checkbox" value="a-4" /> PDF/A-4</label>
              <label><input type="checkbox" value="a-4f" /> PDF/A-4f</label>
              <label><input type="checkbox" value="a-4e" /> PDF/A-4e</label>
              <strong>PDF/UA</strong>
              <label><input type="checkbox" value="ua-1" /> PDF/UA-1</label>
            </div>
          </details>
          <button id="export-button">Download</button>
        </div>
      </div>
      <nav id="outline" aria-label="Document outline"></nav>
      <div id="editor"></div>
      <div id="preview"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
