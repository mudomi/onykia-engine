<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onykia x CodeMirror</title>
    <style>
      html, body, #app { margin: 0; height: 100%; }
      #app { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; height: 100vh; }
      #toolbar { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; padding: 6px 12px; border-bottom: 1px solid #ddd; background: #f5f5f5; font: 14px system-ui, sans-serif; }
      #toolbar label { color: #555; }
      #editor, #preview { overflow: auto; }
      #editor { border-right: 1px solid #ddd; }
      #preview { padding: 16px; background: #fafafa; }
      #preview svg, #preview canvas, #preview iframe { width: 100%; height: auto; box-shadow: 0 1px 4px rgba(0,0,0,.1); margin-bottom: 12px; background: #fff; }
      #preview iframe { height: calc(100vh - 80px); border: 0; }
      .cm-editor { height: 100%; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <label for="format">Preview:</label>
        <select id="format">
          <option value="svg">SVG</option>
          <option value="canvas">Canvas (raster)</option>
          <option value="html">HTML</option>
        </select>
        <button id="export">Export PDF</button>
      </div>
      <div id="editor"></div>
      <div id="preview"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
