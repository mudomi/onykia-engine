name: Release

on:
  push:
    branches: [release]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write       # tag + push release commit
      issues: write         # semantic-release issue comments
      pull-requests: write  # semantic-release PR comments
      id-token: write       # npm OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli
        run: |
          VERSION=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/version = |"/, "", $0); print; exit}' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$VERSION" --locked

      - name: Install npm deps
        run: npm ci

      - name: Build WASM
        run: npm run build:wasm

      - name: Build TS packages
        run: npm run build:ts

      - name: Copy license and readme files into each package
        run: |
          for pkg in packages/engine packages/codemirror packages/monaco; do
            cp LICENSE NOTICE THIRD-PARTY-LICENSES.txt README.md "$pkg/"
          done

      - name: semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Fast-forward `develop` to `release` for version bump
  back-merge:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Fast-forward develop to release
        run: |
          git fetch origin release
          git merge --ff-only origin/release
          git push origin develop
