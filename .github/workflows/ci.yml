name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src, rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.100 --locked

      - name: Install npm deps
        run: npm ci

      - name: Lint (TS)
        run: npm run lint

      - name: Lint (Rust — formatting)
        working-directory: src/rust
        run: cargo fmt --check

      - name: Lint (Rust — clippy)
        run: cargo clippy --target wasm32-unknown-unknown -p onykia_core --all-targets -- -D warnings

      - name: Build WASM
        run: npm run build:wasm

      - name: Build TS packages
        run: npm run build:ts

      - name: Type-check examples
        run: |
          npm run -w onykia-example-codemirror check
          npm run -w onykia-example-monaco     check
