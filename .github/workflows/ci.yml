name: CI

on:
  pull_request:
    branches: [develop, release]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify package-lock.json is in sync with package.json
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package-lock.json package.json 'packages/*/package.json' 'example/*/package.json'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build packages
        run: npm run build:ts

      - name: Type-check examples
        run: |
          npm run -w onykia-example-codemirror check
          npm run -w onykia-example-monaco     check

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt

      # wasm-bindgen-rayon requires +atomics,+bulk-memory which in turn need
      # `-Z build-std`, so clippy on the wasm target has to run on nightly.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
          components: clippy, rust-src

      - uses: Swatinem/rust-cache@v2

      - name: Format
        working-directory: src/rust
        run: cargo fmt --check

      - name: Clippy
        env:
          RUSTFLAGS: "-C target-feature=+atomics,+bulk-memory -C link-arg=--shared-memory -C link-arg=--max-memory=1073741824 -C link-arg=--import-memory -C link-arg=--export=__wasm_init_tls -C link-arg=--export=__tls_size -C link-arg=--export=__tls_align -C link-arg=--export=__tls_base"
        run: |
          cargo +nightly clippy --target wasm32-unknown-unknown \
            -Z build-std=panic_abort,std \
            -p onykia_core --all-targets -- -D warnings

      - name: Install wasm-bindgen-cli
        # Match the version Cargo resolved for the `wasm-bindgen` crate so the
        # CLI's schema and the produced WASM's schema stay in lockstep.
        run: |
          VERSION=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/version = |"/, "", $0); print; exit}' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$VERSION" --locked

      - name: Build WASM
        run: bash scripts/build-wasm.sh

  licenses:
    name: THIRD-PARTY-LICENSES freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Verify THIRD-PARTY-LICENSES.txt is up to date
        run: bash scripts/update-licenses.sh --check
